<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://apis.google.com https://www.gstatic.com; connect-src 'self' https://maincloud.spacetimedb.com wss://maincloud.spacetimedb.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.web.app;">
<title>Weltraum Admin</title>
<style>
  :root { --bg:#07101f; --card:#12203a; --line:#3d6bff; --muted:#9bb0d4; --ok:#7dffa8; --err:#ff9a9a; }
  body { margin: 0; font: 15px/1.45 Trebuchet MS, Segoe UI, Arial, sans-serif; background: var(--bg); color: #e8eefc; }
  header { padding: 14px 20px; background: var(--card); border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 20px; }
  main { padding: 16px 20px 48px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.9fr); gap: 18px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 110px; }
  .card b { display: block; font-size: 20px; }
  .card.live { border-color: var(--ok); }
  .card.live b { color: var(--ok); }
  .onlineNow, .admins { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .onlineNow h2, .admins h2 { margin: 0 0 8px; font-size: 16px; }
  .onlineNow table tr { cursor: default; }
  input, select, button { font: inherit; border-radius: 8px; border: 1px solid #4a6cff; padding: 6px 10px; background: #0c1730; color: #fff; }
  button { background: #2a4dff; cursor: pointer; }
  button.danger { background: #a32030; }
  button.ghost { background: transparent; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #243656; }
  th { cursor: pointer; color: var(--muted); white-space: nowrap; }
  tr { cursor: pointer; }
  tr:hover, tr.on { background: #1a2c4d; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  .err { color: var(--err); }
  .ok { color: var(--ok); }
  .gate { max-width: 560px; margin: 60px auto; text-align: center; }
  .diag { width: 100%; margin-top: 18px; font-size: 13px; text-align: left; }
  .diag th { color: var(--muted); width: 40%; }
  .muted { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #243656; font-size: 12px; }
  .filters label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  h3 { margin: 16px 0 6px; font-size: 14px; color: #c9d7ff; }
  pre { white-space: pre-wrap; font-size: 12px; background: #0c1730; padding: 8px; border-radius: 8px; }
  .warn { border: 1px solid #c9a227; background: #2a2208; padding: 10px; border-radius: 10px; margin-top: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/admin.ts"></script>
</body>
</html>
