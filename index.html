<script>
// Redirect to the game - in production this would be bundled
// For development, we load the game from public/index.html via iframe or direct integration
(function() {
  // Load game after i18n and spacetime are initialized
  window.addEventListener('load', function() {
    // Wait for weltraum systems to be ready
    var checkReady = setInterval(function() {
      if (window.__weltraum) {
        clearInterval(checkReady);
        loadGame();
      }
    }, 50);
    
    setTimeout(function() {
      clearInterval(checkReady);
      loadGame(); // Load anyway after 2s
    }, 2000);
  });
  
  function loadGame() {
    // For now, redirect to the static game file
    // In a full implementation, we'd inline the game or use dynamic imports
    window.location.href = '/public/index.html';
  }
})();
</script>
<noscript>
  <p style="color: white; font-family: sans-serif; padding: 20px;">
    JavaScript is required to play Space Mission.
  </p>
