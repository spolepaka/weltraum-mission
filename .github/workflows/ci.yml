name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Module typecheck (same tsconfig as spacetime publish)
        run: npm run spacetime:typecheck
      - run: npx tsc --noEmit
      - run: npm test
